apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: vllm-sim-metrics
  labels:
    app: vllm-sim-metrics
spec:
  selector:
    matchLabels:
      app: ${POOL_NAME}
  podTargetLabels:
    - app
    - llm-d.ai/component
    - llm-d.ai/role
  podMetricsEndpoints:
    - port: http
      interval: 15s
      path: /metrics
    - port: prefill-http
      interval: 15s
      path: /metrics
    - port: sidecar-http
      interval: 15s
      path: /metrics
